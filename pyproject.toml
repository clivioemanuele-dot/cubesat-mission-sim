[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cubesat-mission-sim"
version = "0.1.0"
description = "Simulatore di missione per un CubeSat 3U in orbita bassa (dati simulati)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1",
    "pydantic>=2.13.5",
    "streamlit>=1.64",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
# Il nome del progetto (cubesat-mission-sim) è diverso dal nome del pacchetto
# importabile (cubesat_sim): lo indichiamo esplicitamente.
packages = ["src/cubesat_sim"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle: errori di stile
    "W",       # pycodestyle: avvisi di stile
    "F",       # pyflakes: errori logici (nomi non definiti, import inutili)
    "I",       # isort: ordine degli import
    "N",       # pep8-naming: convenzioni sui nomi
    "UP",      # pyupgrade: sintassi moderna di Python
    "B",       # flake8-bugbear: bug probabili
    "SIM",     # flake8-simplify: codice semplificabile
    "C4",      # flake8-comprehensions: comprehension corrette
    "PT",      # flake8-pytest-style: stile dei test
    "NPY",     # regole specifiche di numpy
    "RUF",     # regole proprie di ruff
    "T20",     # niente print() nel codice del pacchetto
    "PLR2004", # niente numeri magici nei confronti
    "D",       # pydocstyle: docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Nei test docstring e numeri letterali sono accettati.
"tests/**/*.py" = ["D", "PLR2004"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# plotly non dichiara i tipi (manca il file py.typed): mypy lo tratta come Any.
module = ["plotly.*"]
ignore_missing_imports = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]